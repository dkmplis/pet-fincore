spring:
  application:
    name: risk-service

  datasource:
    url: jdbc:postgresql://localhost:5434/risk
    username: risk
    password: risk

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  liquibase:
    enabled: true

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

    consumer:
      group-id: risk-service
      enable-auto-commit: false

      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest

    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        acks: all
        max.block.ms: 5000

    listener:
      ack-mode: record

server:
  port: 8083

risk:
  policy:
    max-transfer-amount-minor: 500000

outbox:
  publisher:
    enabled: true
    batch-size: 10
    claim-timeout: 3m
    send-timeout: 5s
    fixed-delay-ms: 1000