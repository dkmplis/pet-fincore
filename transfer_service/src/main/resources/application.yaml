spring:
  application:
    name: transfer-service
  datasource:
    url: jdbc:postgresql://localhost:5433/transfer
    username: transfer
    password: transfer
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  liquibase:
    enabled: true

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

      properties:
        acks: all

server:
  port: 8082

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info

clients:
  ledger:
    base-url : ${LEDGER_BASE_URL:http://localhost:8081}
    connect-timeout: 2s
    read-timeout: 5s

outbox:
  publisher:
    enabled: true
    batch-size: 100
    claim-timeout: 1m
    send-timeout: 5s
    fixed-delay-ms: 1000